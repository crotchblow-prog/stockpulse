name: Daily Market Report

on:
  schedule:
    # 02:00 UTC = 10:00 Asia/Taipei, weekdays only.
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Override report date (YYYY-MM-DD, Asia/Taipei). Leave blank for today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Generate report
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py

      - name: Commit + push if report changed
        run: |
          git config user.name "stockpulse-bot"
          git config user.email "stockpulse-bot@users.noreply.github.com"
          git add web/public/reports/
          if git diff --staged --quiet; then
            echo "No report changes — skipping commit."
            exit 0
          fi
          DATE=$(date -u -d "+8 hours" +%Y-%m-%d)
          git commit -m "report: ${DATE}"
          git push
