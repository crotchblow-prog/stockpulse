name: web-visual

on:
  pull_request:
    paths:
      - "web/**"
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:

# Frontend visual regression CI for the Phase 3.0 design under /v2 → /.
# Runs Playwright `--grep visual` against npm run build + start, comparing
# screenshots to baselines committed under web/tests/visual/__screenshots__/.
# Tolerance is set per test in the spec files (default maxDiffPixelRatio: 0.005).
#
# Out of scope: anything in scripts/ or .github/workflows/{daily-report,
# regime_sensitivity}.yml — those run the Python pipeline and are off-limits
# from Brief B per ARIA's hard-stop rules.

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run visual regression tests
        run: npx playwright test --grep visual

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
